<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Макет страницы «Услуги» - ZOBNIN TEAM</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      --ink: #171717;
      --muted: #6d6d73;
      --surface: #ffffff;
      --stage: #ececf1;
      --red: #e72c2c;
      --line: #d8d8de;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; color: var(--ink); background: var(--stage); }
    button, a { font: inherit; }

    .preview-toolbar {
      position: relative;
      z-index: 2;
      min-height: 68px;
      padding: 10px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 5px 24px rgba(20, 20, 28, .08);
    }

    .preview-title {
      min-width: 0;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .view-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #f0f0f4;
    }

    .view-button {
      min-height: 38px;
      padding: 8px 18px;
      border: 0;
      border-radius: 999px;
      color: #55555c;
      background: transparent;
      font-weight: 700;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .view-button[aria-pressed="true"] {
      color: #fff;
      background: var(--red);
      box-shadow: 0 6px 16px rgba(231, 44, 44, .24);
    }

    .open-page {
      justify-self: end;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
    }

    .open-page:hover { color: var(--ink); }

    .preview-stage {
      height: calc(100vh - 68px);
      padding: 18px;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .preview-frame {
      width: min(1440px, 100%);
      height: 100%;
      flex: 0 0 auto;
      overflow: hidden;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: 0 18px 52px rgba(17, 17, 24, .16);
      transition: width .24s ease, border-radius .24s ease;
    }

    .preview-stage[data-view="mobile"] .preview-frame {
      width: 390px;
      min-height: 720px;
      border-radius: 22px;
      border: 1px solid #cfcfd6;
    }

    .preview-stage[data-view="accordion"] .preview-frame {
      width: 390px;
      min-height: 720px;
      border-radius: 22px;
      border: 1px solid #cfcfd6;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 720px) {
      .preview-toolbar {
        min-height: 112px;
        padding: 10px 12px;
        grid-template-columns: 1fr auto;
      }

      .preview-title { grid-column: 1 / -1; text-align: center; }
      .view-switcher { width: 100%; grid-column: 1 / -1; justify-self: stretch; }
      .view-button { min-width: 0; flex: 1; padding-inline: 8px; font-size: 12px; }
      .open-page { font-size: 13px; }
      .preview-stage { height: calc(100vh - 112px); padding: 10px; }
      .preview-stage[data-view="mobile"], .preview-stage[data-view="accordion"] { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="preview-toolbar">
    <div class="preview-title">Макет страницы «Услуги»</div>
    <div class="view-switcher" role="group" aria-label="Размер макета">
      <button class="view-button" type="button" data-view-button="desktop" aria-pressed="true">Десктоп</button>
      <button class="view-button" type="button" data-view-button="mobile" aria-pressed="false">Мобильная</button>
      <button class="view-button" type="button" data-view-button="accordion" aria-pressed="false">Моб. раскладушка</button>
    </div>
    <a class="open-page" href="./prototype.html" target="_blank" rel="noopener">Открыть без рамки ↗</a>
  </header>

  <main class="preview-stage" data-view="desktop">
    <div class="preview-frame">
      <iframe src="./prototype.html" title="Макет страницы услуг ZOBNIN TEAM"></iframe>
    </div>
  </main>

  <script>
    const stage = document.querySelector('.preview-stage');
    const frame = document.querySelector('iframe');
    const openPage = document.querySelector('.open-page');
    const buttons = [...document.querySelectorAll('[data-view-button]')];
    const params = new URLSearchParams(location.search);

    const setView = (view, updateUrl = true) => {
      const nextView = ['mobile', 'accordion'].includes(view) ? view : 'desktop';
      stage.dataset.view = nextView;
      const prototypeUrl = nextView === 'accordion' ? './prototype.html?layout=accordion' : './prototype.html';
      if (frame.getAttribute('src') !== prototypeUrl) frame.src = prototypeUrl;
      openPage.href = prototypeUrl;
      buttons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.viewButton === nextView));
      });

      if (updateUrl) {
        params.set('view', nextView);
        history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
      }
    };

    buttons.forEach((button) => {
      button.addEventListener('click', () => setView(button.dataset.viewButton));
    });

    setView(params.get('view'), false);
  </script>
</body>
</html>
