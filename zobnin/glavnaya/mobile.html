<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Мобильный предпросмотр Zobnin Team</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;grid-template-rows:auto 1fr;background:#202124;color:#fff;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .toolbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:#111;border-bottom:1px solid #3c4043}
    .toolbar strong{margin-right:8px}
    button{min-height:40px;padding:8px 14px;border:1px solid #5f6368;border-radius:20px;background:#292a2d;color:#fff;font:inherit;cursor:pointer}
    button[aria-pressed="true"]{border-color:#ef2d31;background:#ef2d31}
    .stage{display:grid;place-items:start center;overflow:auto;padding:20px}
    .device{width:390px;height:844px;max-width:100%;overflow:hidden;border:10px solid #0f0f10;border-radius:34px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.45);transition:width .2s ease,height .2s ease}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @media(max-width:560px){.toolbar{justify-content:flex-start;overflow-x:auto}.toolbar strong{display:none}.stage{padding:8px}.device{border-width:4px;border-radius:20px}}
  </style>
</head>
<body>
  <div class="toolbar" aria-label="Ширина предпросмотра">
    <strong>Мобильный предпросмотр</strong>
    <button type="button" data-width="320">320 px</button>
    <button type="button" data-width="375">375 px</button>
    <button type="button" data-width="390" aria-pressed="true">390 px</button>
    <button type="button" data-width="430">430 px</button>
  </div>
  <main class="stage">
    <div class="device" id="device">
      <iframe src="./?v=hero-copy-v2" title="Мобильная версия главной страницы Zobnin Team"></iframe>
    </div>
  </main>
  <script>
    const device = document.getElementById('device');
    document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => {
      const width = Number(button.dataset.width);
      device.style.width = width + 'px';
      device.style.height = Math.round(width * 844 / 390) + 'px';
      document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    }));
  </script>
</body>
</html>
