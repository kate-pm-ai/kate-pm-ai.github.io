<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>ZOBNIN TEAM · просмотр страницы ОФП</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #fff;
      background: #121212;
      font: 14px Manrope, Arial, sans-serif;
    }
    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 24px;
      flex-wrap: wrap;
    }
    strong { font-size: 16px; }
    small { opacity: .72; }
    nav { display: flex; gap: 8px; }
    button, a { color: inherit; font: inherit; }
    button {
      padding: 9px 20px;
      border: 1px solid #dd2c2c;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      color: #fff;
      background: #dd2c2c;
    }
    button:focus-visible, a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    a { font-size: 12px; }
    .stage {
      height: calc(100dvh - 72px);
      display: flex;
      justify-content: center;
      padding: 0 12px 12px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 12px;
      background: #fff;
    }
    .stage.mobile iframe {
      width: 390px;
      max-width: 100%;
      border-radius: 22px;
    }
    @media (max-width: 650px) {
      header { padding: 8px 12px; gap: 8px; }
      .stage { height: calc(100dvh - 112px); }
      button { padding: 8px 15px; }
    }
  </style>
</head>
<body>
  <header>
    <div><strong>ZOBNIN TEAM</strong> <small>· макет страницы ОФП</small></div>
    <nav aria-label="Режим просмотра">
      <button id="desktop" type="button" aria-pressed="true">Десктоп</button>
      <button id="mobile" type="button" aria-pressed="false">Мобильная</button>
    </nav>
    <a href="./page.html" target="_blank" rel="noopener">Открыть страницу отдельно ↗</a>
  </header>
  <main class="stage" id="stage">
    <iframe src="./page.html" title="Страница ОФП ZOBNIN TEAM"></iframe>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const modes = ['desktop', 'mobile'];

    function setMode(name) {
      stage.classList.toggle('mobile', name === 'mobile');
      for (const id of modes) {
        document.getElementById(id).setAttribute('aria-pressed', String(id === name));
      }
      history.replaceState(null, '', `#${name}`);
    }

    for (const id of modes) {
      document.getElementById(id).addEventListener('click', () => setMode(id));
    }

    setMode(location.hash === '#mobile' ? 'mobile' : 'desktop');
  </script>
</body>
</html>
