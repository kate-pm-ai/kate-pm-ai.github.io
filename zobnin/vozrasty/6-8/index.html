<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>ZOBNIN TEAM · просмотр страницы 6-8 лет</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#121212;color:#fff;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px;flex-wrap:wrap;border-bottom:1px solid #ffffff2e}
    strong{font-size:16px}small{opacity:.68}nav{display:flex;gap:8px}button,a{font:inherit;color:inherit}
    button{cursor:pointer;background:transparent;border:1px solid #ffffff60;border-radius:99px;padding:9px 20px;font-weight:750}button[aria-pressed="true"]{background:#eb2c2c;border-color:#eb2c2c}
    button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}a{font-size:12px}
    .stage{height:calc(100dvh - 72px);display:flex;justify-content:center;padding:0 12px 12px;background:#d7d8de}
    iframe{height:100%;width:100%;border:1px solid #0002;background:#f3f3f5;border-radius:10px}.stage.mobile iframe{width:390px;max-width:100%;border-radius:22px;box-shadow:0 18px 55px #0005}
    @media(max-width:650px){header{padding:8px 12px;gap:8px}.stage{height:calc(100dvh - 112px)}button{padding:8px 15px}}
  </style>
</head>
<body>
  <header>
    <div><strong>ZOBNIN TEAM</strong> <small>· 6-8 лет</small></div>
    <nav aria-label="Режим просмотра"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button></nav>
    <a href="./page.html" target="_blank" rel="noopener">Открыть страницу отдельно ↗</a>
  </header>
  <main class="stage" id="stage"><iframe src="./page.html" title="Тренировки ZOBNIN TEAM для детей 6-8 лет"></iframe></main>
  <script>
    const stage=document.getElementById('stage');
    function mode(name){stage.classList.toggle('mobile',name==='mobile');for(const id of ['desktop','mobile'])document.getElementById(id).setAttribute('aria-pressed',String(id===name));history.replaceState(null,'','#'+name)}
    for(const id of ['desktop','mobile'])document.getElementById(id).addEventListener('click',()=>mode(id));mode(location.hash==='#mobile'?'mobile':'desktop');
  </script>
</body>
</html>
