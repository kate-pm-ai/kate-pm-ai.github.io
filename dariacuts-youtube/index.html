<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Daria Cuts · просмотр YouTube Video Editing</title>
<style>*{box-sizing:border-box}body{margin:0;background:#263022;color:#e6e6e6;font:14px system-ui}header{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 24px;flex-wrap:wrap}strong{font-size:16px}nav{display:flex;gap:8px}button,a{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:1px solid #bac8b1;border-radius:99px;padding:9px 20px}button[aria-pressed=true]{background:#bac8b1;color:#263022}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.stage{height:calc(100dvh - 72px);display:flex;justify-content:center;padding:0 12px 12px}iframe{height:100%;width:100%;border:1px solid #bac8b155;background:#404e3b;border-radius:10px}.stage.mobile iframe{width:390px;max-width:100%;border-radius:22px}a{font-size:12px}small{opacity:.8}@media(max-width:650px){header{padding:8px 12px;gap:8px}.stage{height:calc(100dvh - 112px)}button{padding:8px 15px}}</style></head>
<body><header><div><strong>Daria Cuts</strong> <small>· макет для согласования</small></div><nav aria-label="Режим просмотра"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button></nav><a href="./page.html" target="_blank" rel="noopener">Открыть страницу отдельно ↗</a></header><main class="stage" id="stage"><iframe src="./page.html" title="YouTube Video Editing Daria Cuts"></iframe></main>
<script>const stage=document.getElementById('stage');function mode(name){stage.classList.toggle('mobile',name==='mobile');for(const id of ['desktop','mobile'])document.getElementById(id).setAttribute('aria-pressed',String(id===name));history.replaceState(null,'','#'+name);}for(const id of ['desktop','mobile'])document.getElementById(id).addEventListener('click',()=>mode(id));mode(location.hash==='#mobile'?'mobile':'desktop');</script></body></html>
